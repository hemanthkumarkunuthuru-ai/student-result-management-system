{% extends 'base.html' %}
{% block content %}

<div class="auth-box">
  <div class="icon">
    <i class="fa-solid fa-user-plus"></i>
  </div>

  <h2>Create Account</h2>
  <p>Register to manage student results</p>

  <form method="post">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password1" placeholder="Create Password" required>
    <input type="password" name="password2" placeholder="Confirm Password" required>

    <button class="primary-btn">Create Account</button>
  </form>

  <p class="switch">Already have an account? <a href="/login/">Login</a></p>
</div>

{% endblock %}
